<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аниме — каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14102a;--sf:#1f1a3d;--tx:#f1eefc;--mu:#a59fc7;--ac:#ff6b9d;--ac2:#7be0d4;--r:14px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #2d2759}
h1{font:600 20px Unbounded,sans-serif;color:var(--ac);letter-spacing:-.5px}
input,select{background:var(--sf);border:1px solid #3a3370;color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
input{flex:1 1 180px}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
main{padding:16px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--sf);border-radius:var(--r);overflow:hidden;cursor:pointer;border:0;color:inherit;text-align:left;padding:0;font:inherit}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2d2759}
.card div{padding:8px 10px 10px}
.card b{display:block;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mu)}
.sc{color:var(--ac2)}
.more{display:block;margin:20px auto;background:var(--ac);color:#25001a;border:0;border-radius:10px;padding:12px 28px;font:600 16px Manrope;cursor:pointer}
.msg{color:var(--mu);text-align:center;padding:40px 0}
dialog{background:var(--sf);color:var(--tx);border:0;border-radius:var(--r);width:min(860px,96vw);max-height:92vh;padding:0;overflow:auto}
dialog::backdrop{background:#000a}
.in{padding:16px}
.x{float:right;background:#2d2759;color:var(--tx);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.pl{aspect-ratio:16/9;width:100%;background:#000;border:0;border-radius:10px;display:block;margin:12px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{background:#2d2759;color:var(--tx);border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ac);color:#25001a}
h2{font:600 18px Unbounded,sans-serif;line-height:1.3}
.meta{color:var(--mu);font-size:14px;margin:6px 0 10px}
.ds{max-height:9em;overflow:auto;color:#d9d4f0;font-size:15px}
.note{font-size:13px;color:var(--mu);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>Аниме</h1>
  <input id="q" type="search" placeholder="Поиск по названию…" aria-label="Поиск">
  <select id="ord" aria-label="Сортировка">
    <option value="popularity">Популярные</option>
    <option value="ranked">Лучшие по рейтингу</option>
    <option value="aired_on">Новые</option>
  </select>
  <select id="st" aria-label="Статус">
    <option value="">Все</option>
    <option value="ongoing">Онгоинги</option>
    <option value="released">Вышли</option>
  </select>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="msg" class="msg"></div>
  <button id="more" class="more" hidden>Показать ещё</button>
</main>
<dialog id="dlg"><div class="in" id="det"></div></dialog>

<script>
/* ===== НАСТРОЙКИ ===== */
const API = 'https://shikimori.one';
/* Свои ЛЕГАЛЬНЫЕ источники видео (то, на что у вас есть права):
   id аниме на Shikimori -> список серий. Тип определяется по ссылке:
   .mp4/.webm/.m3u8 -> тег <video>, остальное -> <iframe>. */
const LICENSED = {
  // 52991: [{ title: 'Серия 1', url: 'https://ваш-сервер/ep1.mp4' }],
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page = 1, busy = false, timer;

async function api(path) {
  const r = await fetch(API + '/api' + path, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function load(reset) {
  if (busy) return;
  busy = true;
  if (reset) { page = 1; $('grid').innerHTML = ''; }
  $('msg').textContent = 'Загрузка…';
  $('more').hidden = true;
  const p = new URLSearchParams({ limit: 24, page, order: $('ord').value, censored: 'true', kind: 'tv,movie,ona,ova' });
  if ($('q').value.trim()) p.set('search', $('q').value.trim());
  if ($('st').value) p.set('status', $('st').value);
  try {
    const list = await api('/animes?' + p);
    $('grid').insertAdjacentHTML('beforeend', list.map(a => `
      <button class="card" data-id="${a.id}">
        <img loading="lazy" src="${API}${esc(a.image.preview)}" alt="">
        <div><b>${esc(a.russian || a.name)}</b>
        <small>${esc((a.aired_on || '').slice(0, 4))} · <span class="sc">★ ${esc(a.score)}</span></small></div>
      </button>`).join(''));
    $('msg').textContent = $('grid').children.length ? '' : 'Ничего не найдено. Попробуйте другой запрос.';
    $('more').hidden = list.length < 24;
    page++;
  } catch (e) {
    $('msg').textContent = 'Не удалось загрузить каталог. Откройте файл в браузере с интернетом и обновите страницу.';
  }
  busy = false;
}

function player(src) {
  if (/\.(mp4|webm|m3u8)(\?|$)/i.test(src))
    return `<video class="pl" controls playsinline src="${esc(src)}"></video>`;
  return `<iframe class="pl" src="${esc(src)}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>`;
}

async function openAnime(id) {
  const d = $('det');
  d.innerHTML = '<p class="msg">Загрузка…</p>';
  $('dlg').showModal();
  try {
    const [a, vids] = await Promise.all([api('/animes/' + id), api(`/animes/${id}/videos`).catch(() => [])]);
    const tmp = new DOMParser().parseFromString(a.description_html || '', 'text/html');
    const desc = tmp.body.textContent.trim() || 'Описания пока нет.';
    const eps = (LICENSED[id] || []).map(e => ({ title: e.title, url: e.url }));
    const trailers = vids.filter(v => v.hosting === 'youtube' && v.player_url)
      .map(v => ({ title: v.name || v.kind, url: v.player_url }));
    const items = [...eps, ...trailers];
    d.innerHTML = `
      <button class="x" aria-label="Закрыть">×</button>
      <h2>${esc(a.russian || a.name)}</h2>
      <div class="meta">${esc(a.name)} · ${esc((a.aired_on || '').slice(0, 4))} · ★ ${esc(a.score)} · эпизодов: ${esc(a.episodes || a.episodes_aired || '?')}<br>${esc((a.genres || []).map(g => g.russian).join(', '))}</div>
      ${items.length ? `<div id="pw">${player(items[0].url)}</div>
        <div class="tabs">${items.map((v, i) => `<button data-i="${i}" aria-pressed="${i === 0}">${esc(v.title)}</button>`).join('')}</div>`
        : '<p class="msg">Для этого тайтла нет доступных видео.</p>'}
      <div class="ds">${esc(desc)}</div>
      <p class="note">${eps.length ? '' : 'Показаны официальные трейлеры и PV. '}Полные серии смотрите у легальных сервисов или добавьте свои источники в LICENSED.</p>`;
    d.querySelector('.x').onclick = () => $('dlg').close();
    d.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
      d.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
      $('pw').innerHTML = player(items[b.dataset.i].url);
    });
  } catch (e) {
    d.innerHTML = '<button class="x" aria-label="Закрыть" onclick="dlg.close()">×</button><p class="msg">Не удалось загрузить информацию.</p>';
  }
}

$('grid').onclick = e => { const c = e.target.closest('.card'); if (c) openAnime(c.dataset.id); };
$('dlg').addEventListener('close', () => $('det').innerHTML = '');
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
$('more').onclick = () => load(false);
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => load(true), 400); };
$('ord').onchange = $('st').onchange = () => load(true);
load(true);
</script>
</body>
</html>
